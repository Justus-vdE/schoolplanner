  <script>
    // Oude service worker opruimen. Op dit domein stond eerder een andere app
    // die een service worker installeerde. Die blijft in de browser van een
    // bezoeker hangen en serveert daarna eeuwig zijn eigen oude bestanden —
    // ook na een harde verversing, en ook als de server allang bijgewerkt is.
    // Wij gebruiken zelf geen service worker, dus alles wat er staat mag weg.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).then(function () { location.reload(); }, function () { location.reload(); });
          } else {
            location.reload();
          }
        });
      }).catch(function () {});
    })();
  </script>
  <script>
    // Thema meteen zetten, vóór het renderen, om opflikkeren te voorkomen
    (function () {
      var p = localStorage.getItem('sp_theme') || 'system';
      var dark = p === 'dark' || (p === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
